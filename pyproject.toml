[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentr"
version = "0.2.0"
description = "Universal terminal session search, native resume, and zero-loss cross-agent handoff for AI coding agents."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ashish Daga", email = "ashish.x.daga@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/ashxddaga/agentr"
Repository = "https://github.com/ashxddaga/agentr"

[project.scripts]
agentr = "agentr.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentr*"]
